<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
  <title>IP Address Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="hero">
    <div class="container">
      <h1 class="title">IP Address Tracker</h1>

      <form id="ip-form" class="search-form" novalidate>
        <input
          id="ip-input"
          type="text"
          class="search-input"
          placeholder="Search for any IP address or domain"
          aria-label="Search for any IP address or domain"
          autocomplete="off"
        />
        <button type="submit" class="search-btn" aria-label="Search">
          <img src="./images/icon-arrow.svg" alt="" />
        </button>
      </form>

      <p id="error-message" class="error-message" role="alert"></p>

      <section class="info-card" aria-live="polite">
        <div class="info-item">
          <span class="info-label">IP Address</span>
          <strong id="ip-value" class="info-value">-</strong>
        </div>
        <div class="info-item">
          <span class="info-label">Location</span>
          <strong id="location-value" class="info-value">-</strong>
        </div>
        <div class="info-item">
          <span class="info-label">Timezone</span>
          <strong id="timezone-value" class="info-value">-</strong>
        </div>
        <div class="info-item">
          <span class="info-label">ISP</span>
          <strong id="isp-value" class="info-value">-</strong>
        </div>
      </section>
    </div>
  </header>

  <main class="map-wrapper">
    <div id="map" aria-label="Location Map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="./app.js"></script>
</body>
</html>
